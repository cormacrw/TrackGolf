type User {
  tutPk: String!
  tutSk: String!
  userId: String
  email: String
  username: String
  googleId: String
}

type Match {
  tutPk: String!
  tutSk: String!
  matchId: String
  userScore: Int
  userPossession: Int
  userXG: Float
  userShots: Int
  userPenalties: Int
  opponentScore: Int
  opponentXG: Float
  opponentShots: Int
  opponentPenalties: Int
  userYellows: Int
  userReds: Int
  minutes: Int
  type: String
  scorers: [String]
  assists: [String]
}

type UserStats {
  gamesCount: Int
  wins: Int
  draws: Int
  losses: Int
  winRate: Float
  averagePossession: Float
  rageQuits: Int
  averageUserXG: Float
  averageOpponentXG: Float
  averageUserShots: Float
  averageOpponentShots: Float
  averageUserGoals: Float
  averageOpponentGoals: Float
  totalUserXG: Float
  totalOpponentXG: Float
  totalUserShots: Int
  totalOpponentShots: Int
  totalUserGoals: Int
  totalOpponentGoals: Int
}

input MatchInput {
  userId: String!
  type: String
  userScore: Int
  userPossession: Int
  userXG: Float
  userShots: Int
  minutes: Int
  userPenalties: Int
  opponentScore: Int
  opponentXG: Float
  opponentShots: Int
  opponentPenalties: Int
  userYellows: Int
  userReds: Int
  scorers: [String]
  assists: [String]
}

type Query {
  getUserByEmail(email: String!): User
  getMatchesByUser(userId: String!): [Match]
  getUserStats(userId: String!): UserStats
}

type Mutation {
  createMatch(input: MatchInput!): Match
}
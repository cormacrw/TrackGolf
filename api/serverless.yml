service: track-ut-graphql

provider:
  name: aws
  region: us-east-1
  stage: dev
  runtime: nodejs20.x
  iam:
    role: ${ssm:/role/sls_trackut}

plugins:
  - serverless-offline
  - serverless-webpack

functions:
  graphql_secure:
    handler: src/lambda/graphql/secure/handler.handle
    timeout: 30
    events:
      - http:
          path: /s/graphql/
          method: ANY
      - http:
          path: /s/graphql/{any+}
          method: ANY
  graphql_public:
    handler: src/lambda/graphql/public/handler.handle
    timeout: 30
    events:
      - http:
          path: graphql/
          method: ANY
      - http:
          path: graphql/{any+}
          method: ANY

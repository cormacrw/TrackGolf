service: track-ut-graphql

provider:
  name: aws
  region: us-east-1
  stage: dev
  runtime: nodejs18.x
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 'dynamodb:BatchGetItem'
            - 'dynamodb:BatchWriteItem'
            - 'dynamodb:DeleteItem'
            - 'dynamodb:GetItem'
            - 'dynamodb:PutItem'
            - 'dynamodb:Query'
            - 'dynamodb:Scan'
          Resource: ${ssm:/database/trackut/arn}
custom:
  webpack:
    includeModules: true

plugins:
  - serverless-offline
  - serverless-webpack

functions:
  graphql_secure:
    handler: src/lambda/graphql/secure/handler.handle
    timeout: 30
    events:
      - http:
          path: /s/graphql/
          method: ANY
      - http:
          path: /s/graphql/{any+}
          method: ANY
  graphql_public:
    handler: src/lambda/graphql/public/handler.handle
    timeout: 30
    events:
      - http:
          path: graphql/
          method: ANY
      - http:
          path: graphql/{any+}
          method: ANY

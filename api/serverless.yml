service: track-golf-api

custom:
  stage: ${opt:stage, 'offline'}
  region: ${opt:region, 'us-east-1'}

  esbuild:
    platform: "node"
    target: node18
    sourcemap: linked
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true
    reloadHandler: true

useDotenv: true

provider:
  name: aws
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  runtime: nodejs18.x
  memorySize: 512
  timeout: 10
  logRetentionInDays: 90
  logs:
    httpApi: true
  httpApi:
    # metrics: true # Enable if you need
    cors: false
  environment:
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    CLIENT_CORS_ORIGIN: ${env:CLIENT_CORS_ORIGIN}
    SUPERTOKENS_CONNECTION_URI: ${env:SUPERTOKENS_CONNECTION_URI}
    SUPERTOKENS_API_KEY: ${env:SUPERTOKENS_API_KEY}
    PUBLIC_API_URL: ${env:PUBLIC_API_URL}

functions:
  api:
    handler: src/handler.handler
    # reservedConcurrency: 100
    events:
      - httpApi:
          path: "/{proxy+}"
          method: "*"

package:
  patterns:
    - "!**/*.test.ts"
  individually: true

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline

service: trackut-api
frameworkVersion: '>= 3.38.0'
provider:
  name: aws
  runtime: provided.al2023
  region: us-east-1
  stage: ${opt:stage}

functions:
  api:
    memorySize: 3008
    timeout: 10
    handler: bootstrap
    events:
      - http:
          path: /api/v1/{proxy+}
          method: ANY

package:
  artifact: deployment.zip
